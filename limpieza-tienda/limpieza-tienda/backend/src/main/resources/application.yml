# ============================================================================
#  AROMA A LIMPIO — Configuración del backend (Spring Boot)
# ============================================================================
#  Todas las variables sensibles se leen de variables de entorno.
#  En Render se configuran desde "Environment" del servicio web.
# ============================================================================

spring:
  application:
    name: limpieza-tienda

  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/limpieza_tienda}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # El esquema se crea con database/schema.sql (no dejamos que Hibernate
      # cree/altere tablas en producción). Usar "validate" si se quiere que
      # la app valide el mapeo al arrancar.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

  sql:
    init:
      # Al arrancar, la app crea las tablas (schema.sql) y carga los productos
      # (data.sql) si no existen. Ambos scripts son idempotentes.
      mode: always
      continue-on-error: false
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 8MB     # tamaño máximo por foto
      max-request-size: 10MB # tamaño máximo total del formulario

server:
  port: ${PORT:8080}
  # Necesario para los health checks y proxies de Render
  forward-headers-strategy: framework

# ----------------------------------------------------------------------------
#  Configuración propia de la tienda
# ----------------------------------------------------------------------------
app:
  cors:
    # Orígenes permitidos (separados por coma). "*" para desarrollo.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin:
    # Credenciales del backoffice. CAMBIAR en producción vía variables de entorno.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  whatsapp:
    # Número en formato internacional SIN "+", espacios ni guiones (wa.me).
    # Argentina: 54 + 9 + código de área + número.
    number: ${WHATSAPP_NUMBER:5492612578860}
  store:
    name: ${STORE_NAME:Aroma a Limpio}
  uploads:
    # Carpeta donde se guardan las fotos subidas (con nombre único UUID).
    dir: ${UPLOADS_DIR:uploads}

logging:
  level:
    com.limpieza.tienda: INFO
