# ============================================================================
#  AROMA A LIMPIO — Configuración del backend (Spring Boot)
# ============================================================================

spring:
  application:
    name: limpieza-tienda

  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/limpieza_tienda}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  whatsapp:
    number: ${WHATSAPP_NUMBER:5492612578860}
  store:
    name: ${STORE_NAME:Aroma a Limpio}
  uploads:
    dir: ${UPLOADS_DIR:uploads}

logging:
  level:
    com.limpieza.tienda: INFO
